<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 160" role="img" aria-label="Contribution calendar waiting for the first Metrics workflow run">
  <style>
    .panel { fill: #ffffff; stroke: #d0d7de; }
    .title { fill: #1a7f37; font: 700 18px ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .copy { fill: #57606a; font: 14px ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    @media (prefers-color-scheme: dark) {
      .panel { fill: #0d1117; stroke: #30363d; }
      .title { fill: #39d353; }
      .copy { fill: #8b949e; }
    }
  </style>
  <rect class="panel" x="1" y="1" width="798" height="158" rx="12"/>
  <text class="title" x="400" y="70" text-anchor="middle">Contribution calendar is warming up</text>
  <text class="copy" x="400" y="98" text-anchor="middle">Run the Metrics workflow once and this card will replace itself.</text>
</svg>
