<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 150" role="img" aria-label="Achievement metrics waiting for the first Metrics workflow run">
  <style>
    .panel { fill: #ffffff; stroke: #d0d7de; }
    .title { fill: #1a7f37; font: 700 18px ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .copy { fill: #57606a; font: 14px ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    @media (prefers-color-scheme: dark) {
      .panel { fill: #0d1117; stroke: #30363d; }
      .title { fill: #39d353; }
      .copy { fill: #8b949e; }
    }
  </style>
  <rect class="panel" x="1" y="1" width="798" height="148" rx="12"/>
  <text class="title" x="400" y="66" text-anchor="middle">Achievement metrics are warming up</text>
  <text class="copy" x="400" y="94" text-anchor="middle">Generated by the Metrics workflow after publishing.</text>
</svg>
